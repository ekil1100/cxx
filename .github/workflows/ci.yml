name: M0 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install Ruff
        run: python3 -m pip install ruff==0.16.8
      - name: Lint and check Python formatting
        run: |
          ruff check .
          ruff format --check .

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Install and select LLVM 20 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Clang 18.1.3 crashes generating code for the Runtime's C++23 lambdas.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
          sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/llvm.asc
          echo "deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-20 llvm-20 clang-tools-20
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "CXX_COMPILER=/usr/bin/clang++-20" >> "$GITHUB_ENV"
      - name: Install and select LLVM 20 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Upstream Clang 18+ supports C++23 explicit object parameters.
          brew install llvm@20
          llvm_prefix="$(brew --prefix llvm@20)"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          echo "CXX_COMPILER=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
      - name: Print selected compiler version
        shell: bash
        run: |
          test -x "$CXX_COMPILER"
          "$CXX_COMPILER" --version
      - name: Bootstrap, self-build and test with the selected Clang
        run: python3 scripts/build.py --compiler "$CXX_COMPILER" --test
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: build/pytest-results.xml
          if-no-files-found: ignore
      - name: Validate the explicit Modules prototype
        run: python3 tests/prototypes/p04/run.py --compiler "$CXX_COMPILER" --scanner "$(command -v clang-scan-deps)"
      - name: Record incremental baseline
        run: python3 scripts/benchmark.py --compiler "$CXX_COMPILER" --cxx build/cxx --output build/benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.os }}
          path: build/benchmark.json
